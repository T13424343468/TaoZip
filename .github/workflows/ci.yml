name: taozip-ci

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  changes:
    name: 改动范围识别
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.f.outputs.android }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          # 纯 PC 改动跳过安卓重型作业 (APK 编译+模拟器触控); 流水线自身变更仍全量跑一遍
          filters: |
            android:
              - 'ZipGo/**'
              - 'tools/android-touch-test.sh'
              - '.github/workflows/ci.yml'

  core-tests:
    name: 全测（PC xunit + 安卓逻辑全测）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: PC 侧全测
        run: |
          dotnet restore TaoZip.PC/tests/TaoZip.Core.Tests/TaoZip.Core.Tests.csproj
          dotnet test TaoZip.PC/tests/TaoZip.Core.Tests/TaoZip.Core.Tests.csproj -c Release --no-restore --logger "console;verbosity=normal"
      - name: 安卓侧逻辑全测
        run: |
          dotnet restore ZipGo/src/TaoZip.Tests/TaoZip.Tests.csproj
          dotnet run --project ZipGo/src/TaoZip.Tests/TaoZip.Tests.csproj -c Release --no-restore

  pc-build:
    name: Windows 真机层编译（PC 界面工程）
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: 编译 PC 全解决方案
        run: dotnet build TaoZip.PC/TaoZip.PC.sln -c Release

  shell-ext-build:
    name: Windows 真机层编译（资源管理器按钮原生 DLL）
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 配置 C++ 工具集
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: 判定清单对齐校验（C++ vs C#，防双源漂移）
        shell: pwsh
        run: |
          $cpp = Get-Content TaoZip.PC/src/TaoZip.ShellExt/TaoZipCommands.cpp -Raw -Encoding UTF8
          # C# 侧清单为唯一事实源 (ArchiveKinds.OpenableExtensions), 逐项断言 C++ 侧含同名单
          $csList = @('.zip','.7z','.rar','.tar','.gz','.bz2','.xz','.tgz','.tbz2','.txz')
          foreach ($e in $csList) {
            if ($cpp -notlike "*`"$e`"*") { throw "C++ 侧缺扩展名 $e，与 C# ArchiveKinds 漂移" }
          }
          foreach ($e in @('.tar.gz','.tar.bz2','.tar.xz')) {
            if ($cpp -notlike "*`"$e`"*") { throw "C++ 侧缺复合扩展名 $e，与 C# ArchiveKinds 漂移" }
          }
          "extension-list-sync: ok ($($csList.Count) + 3 compound)" | Out-File -FilePath evidence_shell_ext_sync.txt -Append
      - name: 编译原生 DLL（MSBuild C++，零警告=错）
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "未找到含 C++ 工具集的 Visual Studio" }
          $msbuild = Join-Path $vs 'MSBuild\Current\Bin\MSBuild.exe'
          & $msbuild TaoZip.PC/src/TaoZip.ShellExt/TaoZipShellext.vcxproj -p:Configuration=Release -p:Platform=x64 -m -warnAsError
          if ($LASTEXITCODE -ne 0) { throw "原生 DLL 编译失败" }
      - name: 存档编译证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taozip-shellext-evidence
          path: evidence_shell_ext_sync.txt

  android-build:
    name: Android 真机层编译（APK）
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: 安装 Android 工作负载
        run: dotnet workload install android
      - name: 编译安卓工程
        run: |
          dotnet restore ZipGo/ui/TaoZip.UI.Android/TaoZip.UI.Android.csproj
          dotnet build ZipGo/ui/TaoZip.UI.Android/TaoZip.UI.Android.csproj -c Release

  android-ui:
    name: 云端真机真人触控实测（模拟器）
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: 安装 Android 工作负载
        run: dotnet workload install android
      - name: 云端出包（APK，显式 publish 定位产物）
        run: |
          dotnet publish ZipGo/ui/TaoZip.UI.Android/TaoZip.UI.Android.csproj -c Release
          dotnet publish ZipGo/ui/TaoZip.UI.Android/TaoZip.UI.Android.csproj -c Release -p:RuntimeIdentifier=android-x64
          echo "---- publish 产物 ----"
          find ZipGo/ui -name "*.apk" -not -path "*/obj/*" || true
          mkdir -p out/android
          find ZipGo/ui -name "*.apk" -not -path "*/obj/*" -exec cp {} out/android/ \;
      - name: 存档安卓安装包
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taozip-android-apk
          path: out/android/*.apk
      - name: 开启 KVM 硬件加速权限 (动作 auto 探测误判致 -accel off, 新模拟器拒绝软件仿真, run 44870126512 实锤)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: 云端真机装机 + 真人触控实测
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          force-avd-creation: false
          disable-animations: false
          disable-linux-hw-accel: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 4096
          script: bash tools/android-touch-test.sh
      - name: 存档实测证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taozip-touch-evidence
          path: evidence/

  pc-mouse-test:
    name: PC 真人鼠标路径实测（Windows）
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: 云端出包（PC 界面工程, 自包含）
        run: >
          dotnet publish TaoZip.PC/ui/TaoZip.PC.App/TaoZip.PC.App.csproj -c Release -r win-x64
          --self-contained true -p:WindowsAppSDKSelfContained=true -p:Platform=x64
      - name: 定位发布目录
        shell: pwsh
        run: |
          $pub = Get-ChildItem -Directory -Recurse -Path TaoZip.PC/ui/TaoZip.PC.App/bin |
                 Where-Object { Test-Path (Join-Path $_.FullName 'TaoZip.exe') } |
                 Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $pub) { throw "没找到含 TaoZip.exe 的发布目录" }
          "EXE=$($pub.FullName)\TaoZip.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: 真人鼠标路径实测（打开/测试/解压/历史）
        shell: pwsh
        run: ./tools/pc-mouse-test.ps1 -ExePath $env:EXE
      - name: 存档实测证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taozip-pc-mouse-evidence
          path: evidence

  pc-install-chain:
    name: PC 安装链（MSI 打包/安装/覆盖升级/卸载/视觉）
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: 配置 C++ 工具集（原生 DLL 随包携带）
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: 编译原生 DLL（资源管理器按钮, 随包携带）
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "未找到含 C++ 工具集的 Visual Studio" }
          $msbuild = Join-Path $vs 'MSBuild\Current\Bin\MSBuild.exe'
          & $msbuild TaoZip.PC/src/TaoZip.ShellExt/TaoZipShellext.vcxproj -p:Configuration=Release -p:Platform=x64 -m -warnAsError
          if ($LASTEXITCODE -ne 0) { throw "原生 DLL 编译失败" }
      - name: 安装 WiX 打包工具
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.5
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.dotnet\tools"
      - name: 云端出包（PC 界面工程, 按新标准框架依赖——安装包不内置 .NET 运行时）
        run: >
          dotnet publish TaoZip.PC/ui/TaoZip.PC.App/TaoZip.PC.App.csproj -c Release -r win-x64
          --self-contained false -p:WindowsAppSDKSelfContained=true -p:Platform=x64
      - name: 定位发布目录
        shell: pwsh
        run: |
          $pub = Get-ChildItem -Directory -Recurse -Path TaoZip.PC/ui/TaoZip.PC.App/bin |
                 Where-Object { Test-Path (Join-Path $_.FullName 'TaoZip.exe') } |
                 Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $pub) { throw "没找到含 TaoZip.exe 的发布目录" }
          "PUBDIR=$($pub.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: MSI 打包（微信风格自绘向导）
        shell: pwsh
        run: ./TaoZip.PC/tools/msi/package.ps1 -PublishDir $env:PUBDIR -OutDir out
      - name: 安装包外观核验（体积/版本/图标源）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          $msi = Get-Item out\*.msi
          "MSI: $($msi.Name)  $([math]::Round($msi.Length/1MB,1)) MB" | Out-File evidence\msi-facts.txt
          if ($msi.Length -lt 1MB) { throw "MSI 体积异常偏小, 可能打包空目录: $msi" }
      - name: 静默安装（首装）
        shell: pwsh
        run: |
          $msi = (Get-Item out\*.msi).FullName
          Remove-Item (Join-Path $env:ProgramData 'TaoZip\taozip-runtime.log') -Force -ErrorAction SilentlyContinue
          # msiexec 等待加 15 分钟封顶挂起守卫: run 43599577839 实锤引擎 5 秒装完、-Wait 等待层死等 38 分钟; 超时/失败抓日志尾部再 fail
          ./tools/msi/invoke-msi.ps1 -MsiArgs "/i `"$msi`" /qn /l*v out\install.log" -LogPath out\install.log
          if (-not (Test-Path 'D:\Program Files\TaoZip\TaoZip.exe')) { throw "首装后安装目录没有 TaoZip.exe" }
          $ctx = Get-Item 'HKLM:\SOFTWARE\Classes\SystemFileAssociations\.zip\shell\TaoZip.Extract\command' -ErrorAction SilentlyContinue
          if (-not $ctx) { throw "首装后右键解压登记缺失（.zip shell TaoZip.Extract）" }
          $ctx2 = Get-Item 'HKLM:\SOFTWARE\Classes\*\shell\TaoZip.Compress\command' -ErrorAction SilentlyContinue
          if (-not $ctx2) { throw "首装后右键压缩登记缺失（* shell TaoZip.Compress）" }
          $unins = Get-ChildItem 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall','HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall' |
                   Where-Object { $_.GetValue('DisplayName') -eq 'TaoZip' }
          if (-not $unins) { throw "首装后没有卸载登记" }
          "first-install: ok $($unins.GetValue('DisplayVersion'))" | Out-File evidence\msi-facts.txt -Append
      - name: 运行时两路断言（有运行时零下载）
        shell: pwsh
        run: |
          # 新标准断言一: 云台已装 .NET 10 桌面运行时, 首装必须零下载直接用
          $log = Join-Path $env:ProgramData 'TaoZip\taozip-runtime.log'
          if (-not (Test-Path $log)) { throw "运行时保障日志缺失: $log" }
          $lines = Get-Content $log
          if (-not ($lines | Where-Object { $_ -match 'runtime-present zero-download' })) { throw "首装未走零下载路: $($lines -join '; ')" }
          "runtime-path-natural: ok" | Out-File evidence\msi-facts.txt -Append
      - name: 覆盖安装（同版本 AllowSameVersionUpgrades）
        shell: pwsh
        run: |
          $msi = (Get-Item out\*.msi).FullName
          ./tools/msi/invoke-msi.ps1 -MsiArgs "/i `"$msi`" /qn /l*v out\cover.log" -LogPath out\cover.log
          "cover-install: ok" | Out-File evidence\msi-facts.txt -Append
      - name: 升级安装（1.0.9 覆盖走 MajorUpgrade）
        shell: pwsh
        run: |
          $env:TAOZIP_PKG_VERSION = '1.0.9'
          ./TaoZip.PC/tools/msi/package.ps1 -PublishDir $env:PUBDIR -OutDir out-upgrade
          $msi = (Get-Item out-upgrade\*.msi).FullName
          ./tools/msi/invoke-msi.ps1 -MsiArgs "/i `"$msi`" /qn /l*v out\upgrade.log" -LogPath out\upgrade.log
          $unins = Get-ChildItem 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall','HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall' |
                   Where-Object { $_.GetValue('DisplayName') -eq 'TaoZip' }
          if (-not $unins) { throw "升级后没有卸载登记" }
          if ($unins.GetValue('DisplayVersion') -ne '1.0.9') { throw "升级后版本不是 1.0.9: $($unins.GetValue('DisplayVersion'))" }
          "upgrade: ok -> $($unins.GetValue('DisplayVersion'))" | Out-File evidence\msi-facts.txt -Append
      - name: 卸载后核验（登记清空+目录清除）
        shell: pwsh
        run: |
          $msi = (Get-Item out-upgrade\*.msi).FullName
          ./tools/msi/invoke-msi.ps1 -MsiArgs "/x `"$msi`" /qn /l*v out\uninstall.log" -LogPath out\uninstall.log
          $unins = Get-ChildItem 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall','HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall' |
                   Where-Object { $_.GetValue('DisplayName') -eq 'TaoZip' }
          if ($unins) { throw "卸载后卸载登记仍在" }
          if (Test-Path 'D:\Program Files\TaoZip') { throw "卸载后安装目录仍在" }
          "uninstall: ok" | Out-File evidence\msi-facts.txt -Append
      - name: 重装 + 装后视觉（启动/进程/截图）
        shell: pwsh
        run: |
          $msi = (Get-Item out-upgrade\*.msi).FullName
          ./tools/msi/invoke-msi.ps1 -MsiArgs "/i `"$msi`" /qn" -LogPath out\install.log
          Start-Process 'D:\Program Files\TaoZip\TaoZip.exe'
          Start-Sleep -Seconds 15
          $proc = Get-Process TaoZip -ErrorAction SilentlyContinue
          if (-not $proc) { throw "重装后进程未存活" }
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap($b.Width, $b.Height)
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\evidence\installed-app.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $g.Dispose(); $bmp.Dispose()
          Stop-Process -Name TaoZip -Force -ErrorAction SilentlyContinue
          "visual: ok" | Out-File evidence\msi-facts.txt -Append
      - name: 运行时两路断言（无运行时下载装齐）
        shell: pwsh
        run: |
          # 新标准断言二: 强制走下载路, 官方运行时装进系统统一 .NET 目录后装齐
          ./tools/msi/invoke-msi.ps1 -MsiArgs "/x `"$((Get-Item out-upgrade\*.msi).FullName)`" /qn" -LogPath out\uninstall2.log
          Remove-Item (Join-Path $env:ProgramData 'TaoZip\taozip-runtime.log') -Force -ErrorAction SilentlyContinue
          $env:TAOZIP_FORCE_RUNTIME_DOWNLOAD = '1'
          ./tools/msi/invoke-msi.ps1 -MsiArgs "/i `"$((Get-Item out-upgrade\*.msi).FullName)`" /qn /l*v out\forced-runtime.log" -LogPath out\forced-runtime.log
          $log = Join-Path $env:ProgramData 'TaoZip\taozip-runtime.log'
          if (-not (Test-Path $log)) { throw "运行时保障日志缺失: $log" }
          $lines = Get-Content $log
          if (-not ($lines | Where-Object { $_ -match 'runtime-download-install ok' })) { throw "强制下载路未装齐: $($lines -join '; ')" }
          "runtime-path-forced: ok" | Out-File evidence\msi-facts.txt -Append
          $env:TAOZIP_FORCE_RUNTIME_DOWNLOAD = $null
      - name: 存档安装链证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taozip-install-chain-evidence
          path: |
            evidence
            out/*.log
            out/*.msi

  pc-msi-delivery:
    name: PC 安装包直出（MSI 快速交付）
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: 配置 C++ 工具集（原生 DLL 随包携带）
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: 编译原生 DLL（资源管理器按钮, 随包携带）
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "未找到含 C++ 工具集的 Visual Studio" }
          $msbuild = Join-Path $vs 'MSBuild\Current\Bin\MSBuild.exe'
          & $msbuild TaoZip.PC/src/TaoZip.ShellExt/TaoZipShellext.vcxproj -p:Configuration=Release -p:Platform=x64 -m -warnAsError
          if ($LASTEXITCODE -ne 0) { throw "原生 DLL 编译失败" }
      - name: 安装 WiX 打包工具
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.5
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.dotnet\tools"
      - name: 云端出包（PC 界面工程, 按新标准框架依赖——安装包不内置 .NET 运行时）
        run: >
          dotnet publish TaoZip.PC/ui/TaoZip.PC.App/TaoZip.PC.App.csproj -c Release -r win-x64
          --self-contained false -p:WindowsAppSDKSelfContained=true -p:Platform=x64
      - name: 定位发布目录
        shell: pwsh
        run: |
          $pub = Get-ChildItem -Directory -Recurse -Path TaoZip.PC/ui/TaoZip.PC.App/bin |
                 Where-Object { Test-Path (Join-Path $_.FullName 'TaoZip.exe') } |
                 Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $pub) { throw "没找到含 TaoZip.exe 的发布目录" }
          "PUBDIR=$($pub.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: MSI 打包（微信风格自绘向导）
        shell: pwsh
        run: ./TaoZip.PC/tools/msi/package.ps1 -PublishDir $env:PUBDIR -OutDir out
      - name: 直出核验（体积/唯一性）
        shell: pwsh
        run: |
          $msis = Get-Item out\*.msi
          if ($msis.Count -ne 1) { throw "out 下 msi 数量异常: $($msis.Count)" }
          if ($msis[0].Length -lt 1MB) { throw "MSI 体积异常偏小: $($msis[0].Name)" }
          "delivery: $($msis[0].Name) $([math]::Round($msis[0].Length/1MB,1)) MB"
      - name: 直出 MSI 上传
        uses: actions/upload-artifact@v4
        with:
          name: taozip-msi-delivery
          path: out/*.msi
