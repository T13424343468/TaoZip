name: taozip-ci

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  core-tests:
    name: 全测（PC xunit + 安卓逻辑全测）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: PC 侧全测
        run: |
          dotnet restore TaoZip.PC/tests/TaoZip.Core.Tests/TaoZip.Core.Tests.csproj
          dotnet test TaoZip.PC/tests/TaoZip.Core.Tests/TaoZip.Core.Tests.csproj -c Release --no-restore --logger "console;verbosity=normal"
      - name: 安卓侧逻辑全测
        run: |
          dotnet restore ZipGo/src/TaoZip.Tests/TaoZip.Tests.csproj
          dotnet run --project ZipGo/src/TaoZip.Tests/TaoZip.Tests.csproj -c Release --no-restore

  pc-build:
    name: Windows 真机层编译（PC 界面工程）
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: 编译 PC 全解决方案
        run: dotnet build TaoZip.PC/TaoZip.PC.sln -c Release

  android-build:
    name: Android 真机层编译（APK）
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: 安装 Android 工作负载
        run: dotnet workload install android
      - name: 编译安卓工程
        run: |
          dotnet restore ZipGo/ui/TaoZip.UI.Android/TaoZip.UI.Android.csproj
          dotnet build ZipGo/ui/TaoZip.UI.Android/TaoZip.UI.Android.csproj -c Release

  android-ui:
    name: 云端真机真人触控实测（模拟器）
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: 安装 Android 工作负载
        run: dotnet workload install android
      - name: 云端出包（APK）
        run: dotnet build ZipGo/ui/TaoZip.UI.Android/TaoZip.UI.Android.csproj -c Release
      - name: 云端真机装机 + 真人触控实测
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 4096
          script: |
            set -e
            mkdir -p evidence
            APK=$(find ZipGo/ui -name "*.apk" | head -1)
            echo "APK=$APK"
            adb kill-server || true
            adb start-server
            adb wait-for-device
            adb shell 'while [ -z "$(getprop sys.boot_completed 2>/dev/null)" ]; do sleep 2; done'
            sleep 5
            adb install -r "$APK"
            (adb shell screenrecord --time-limit 120 /sdcard/tao.mp4 &) || true
            adb shell monkey -p com.taozip.app -c android.intent.category.LAUNCHER 1
            sleep 18
            adb exec-out screencap -p > evidence/01_boot.png
            PID=$(adb shell pidof com.taozip.app | tr -d '\r')
            test -n "$PID" || { echo "FAIL: 启动后进程不在"; exit 1; }
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null || true
            adb pull /sdcard/ui.xml evidence/01_ui.xml || true
            python3 - <<'PYEOF'
            import re, sys
            xml = open('evidence/01_ui.xml', encoding='utf-8').read() or ''
            m = re.search(r'text="内部存储"[^>]*bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', xml)
            if not m:
                print('FAIL: 未找到内部存储标题'); sys.exit(1)
            tl, tt, tr, tb = map(int, m.groups())
            nodes = [(int(a),int(b),int(c),int(d)) for a,b,c,d in
                     re.findall(r'clickable="true"[^>]*bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', xml)]
            def cy(n): return (n[1]+n[3])//2
            sort = [n for n in nodes if tt <= cy(n) <= tb and n[0] > tr]
            tasks = sorted([n for n in nodes if n[3] < tt], key=lambda n: n[0])
            if not sort:
                print('FAIL: 排序入口未在内部存储标题行右侧找到'); sys.exit(1)
            def mid(n): return ((n[0]+n[2])//2, (n[1]+n[3])//2)
            open('evidence/sort_xy.txt','w').write('%d %d' % mid(sort[0]))
            if tasks:
                open('evidence/task_xy.txt','w').write('%d %d' % mid(tasks[0]))
            print('OK sort=%s tasks=%s' % (mid(sort[0]), tasks[0] if tasks else 'n/a'))
            PYEOF
            if [ -f evidence/task_xy.txt ]; then
              read TX TY < evidence/task_xy.txt
              adb shell input tap $TX $TY; sleep 4
              adb exec-out screencap -p > evidence/02_tasks.png
              adb shell input keyevent 4; sleep 2
            fi
            read SX SY < evidence/sort_xy.txt
            adb shell input tap $SX $SY; sleep 3
            adb exec-out screencap -p > evidence/03_sort_menu.png
            adb shell uiautomator dump /sdcard/ui2.xml >/dev/null || true
            adb pull /sdcard/ui2.xml evidence/03_sort_ui.xml || true
            adb shell input keyevent 4; sleep 2
            adb shell input tap 540 320; sleep 3
            adb shell input text "zip"; sleep 3
            adb exec-out screencap -p > evidence/04_search.png
            adb shell input keyevent 111; sleep 2
            adb shell input swipe 540 1400 540 400 300; sleep 3
            adb exec-out screencap -p > evidence/05_swipe.png
            PID2=$(adb shell pidof com.taozip.app | tr -d '\r')
            test -n "$PID2" || { echo "FAIL: 触控后进程不在"; exit 1; }
            adb exec-out screencap -p > evidence/06_alive.png
            adb pull /sdcard/tao.mp4 evidence/06_screenrecord.mp4 || true
            echo "PASS: 真人触控全程进程存活"
      - name: 存档实测证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taozip-touch-evidence
          path: evidence/
